# The harness's own tests. No sandbox, no API key, no network — so this is
# safe to run on every push and every pull request, including from forks.
name: tests

on:
  push:
    paths:
      - "agent-eval/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "agent-eval/**"
      - ".github/workflows/tests.yml"

jobs:
  offline:
    name: offline tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bracket the supported range rather than testing one version.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --quiet -e "./agent-eval[claude]"

      - name: Run tests
        working-directory: agent-eval
        run: python -m unittest discover -s tests -v
